<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Resolver</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS for dark theme and typography -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        :root {
            --bg-color-dark: #121212;
            --bg-color-light: #FFFFFF;
            --container-bg-dark: #202020;
            --container-bg-light: #F3F4F6;
            --header-bg-dark: #1A1A1A;
            --header-bg-light: #E5E7EB;
            --message-bg-bot-dark: #2F2F2F;
            --message-bg-bot-light: #E5E7EB;
            --message-bg-user-dark: #10B981;
            --message-bg-user-light: #3B82F6;
            --message-text-user-dark: #E0E0E0;
            --message-text-user-light: #FFFFFF;
            --text-color-dark: #E0E0E0;
            --text-color-light: #1F2937;
            --input-bg-dark: #374151;
            --input-bg-light: #DBEAFE;
            --input-text-dark: #E5E7EB;
            --input-text-light: #1F2937;
            --placeholder-color-dark: #9CA3AF;
            --placeholder-color-light: #6B7280;
            --icon-color-dark: #9CA3AF;
            --icon-color-light: #6B7280;
            --main-icon-dark: #4ade80;
            --main-icon-light: #3B82F6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color-dark);
            color: var(--text-color-dark);
            transition: background-color 0.3s, color 0.3s;
        }
        .message-container {
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            -ms-overflow-style: none; /* For Internet Explorer and Edge */
            scrollbar-width: none; /* For Firefox */
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .message-container::-webkit-scrollbar {
            display: none;
        }

        /* Light theme styles */
        body.light {
            background-color: var(--bg-color-light);
            color: var(--text-color-light);
        }
        body.light .bg-zinc-800 { background-color: var(--container-bg-light); }
        body.light .bg-zinc-900 { background-color: var(--header-bg-light); }
        body.light .text-white { color: var(--text-color-light); }
        body.light .text-gray-400 { color: var(--placeholder-color-light); }
        body.light .bg-zinc-700 { background-color: var(--message-bg-bot-light); }
        body.light .bg-green-600 { background-color: var(--message-bg-user-light); color: var(--message-text-user-light);}
        body.light .text-green-400 { color: var(--main-icon-light); }
        body.light .text-gray-300 { color: var(--icon-color-light); }
        body.light .placeholder-gray-400::placeholder { color: var(--placeholder-color-light); }
        body.light #userIdModal .bg-zinc-800 { background-color: var(--container-bg-light); }
        body.light #userIdModal .bg-zinc-700 {
            background-color: var(--input-bg-light);
            color: var(--input-text-light);
            border: 0;
        }
        body.light #userIdModal .bg-zinc-700:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--main-icon-light);
        }
        body.light #userIdModal .bg-green-500 {
            background-color: var(--main-icon-light);
            color: var(--message-text-user-light);
        }
        body.light #userIdModal .bg-green-500:hover {
            background-color: #2563EB;
        }
        body.light #userInput { 
            background-color: var(--input-bg-light); 
            color: var(--input-text-light);
            border: 0;
        }
        body.light #userInput:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--main-icon-light);
        }
        body.light #sendBtn { background-color: var(--main-icon-light); }
        body.light #sendBtn:hover { background-color: #2563EB; } /* A slightly darker blue for hover effect */
        body.light #sendBtn i { color: #FFFFFF; } /* Changed paper plane icon color to white */
        body.light #userIdInput {
            color: var(--input-text-light);
            background-color: var(--input-bg-light);
            border: 0;
        }
        body.light #userIdInput:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--main-icon-light);
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen p-4">

    <!-- Main Chatbot Container -->
    <div class="bg-zinc-800 rounded-2xl shadow-xl w-full max-w-lg h-full flex flex-col transition-all duration-300 ease-in-out">
        
        <!-- Chatbot Header -->
        <header class="bg-zinc-900 text-white p-4 rounded-t-2xl flex items-center justify-between shadow-md">
            <div class="flex items-center">
                <i class="fa-solid fa-robot text-lg text-green-400 mr-2"></i>
                <h1 class="text-xl font-bold">Codex Resolver</h1>
            </div>
            <!-- User ID and Theme toggle button Container -->
            <div class="flex items-center space-x-2">
                <span id="userIdDisplay" class="text-sm text-gray-400 font-medium"></span>
                <button id="theme-toggle" class="text-white p-2 rounded-full focus:outline-none">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </button>
            </div>
        </header>

        <!-- Message Display Area -->
        <main id="chatWindow" class="message-container flex-1 p-4 space-y-4">
            <!-- Messages will be injected here by JavaScript -->
        </main>

        <!-- Input Area -->
        <footer class="bg-zinc-900 p-4 rounded-b-2xl shadow-md">
            <div class="flex items-center space-x-2">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Enter your message..."
                    class="flex-1 p-3 rounded-xl bg-zinc-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400 border-none transition-all"
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                >
                <button
                    id="sendBtn"
                    class="bg-green-500 hover:bg-green-600 text-white p-3 rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-green-400"
                    onclick="sendMessage()"
                >
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </footer>
        
    </div>

    <!-- Custom Modal/Message Box for alerts -->
    <div id="messageModal" class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-50 hidden items-center justify-center">
        <div class="bg-zinc-800 p-6 rounded-xl shadow-lg w-full max-w-sm text-center">
            <h3 id="modalTitle" class="text-xl font-bold mb-4 text-white"></h3>
            <p id="modalMessage" class="text-gray-300 mb-6"></p>
            <button onclick="closeModal()" class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400 transition-all">OK</button>
        </div>
    </div>

    <!-- User ID Input Modal -->
    <div id="userIdModal" class="fixed inset-0 bg-black bg-opacity-70 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-zinc-800 p-8 rounded-2xl shadow-lg w-full max-w-sm text-center">
            <h3 class="text-2xl font-bold mb-4 text-white">Welcome!</h3>
            <p class="text-gray-300 mb-6">Please enter your user ID to begin.</p>
            <input type="text" id="userIdInput" placeholder="Enter user ID..." class="w-full p-3 rounded-lg bg-zinc-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400 mb-4">
            <button onclick="setUserId()" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400 transition-all">Start</button>
        </div>
    </div>

    <script>
        // Use an immediately-invoked function expression (IIFE) for encapsulation
        (function() {
            const chatWindow = document.getElementById('chatWindow');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const userIdDisplay = document.getElementById('userIdDisplay');
            const themeToggleBtn = document.getElementById('theme-toggle');
            
            let userId = null; // userId is now initialized to null
            const userIdModal = document.getElementById('userIdModal');
            const userIdInput = document.getElementById('userIdInput');

            // --- Theme Handling ---
            const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.body.classList.add(currentTheme);

            themeToggleBtn.addEventListener('click', () => {
                let newTheme = '';
                if (document.body.classList.contains('light')) {
                    document.body.classList.remove('light');
                    newTheme = 'dark';
                } else {
                    document.body.classList.add('light');
                    newTheme = 'light';
                }
                localStorage.setItem('theme', newTheme);
            });

            // Function to set the user ID from the modal and load history
            window.setUserId = function() {
                const inputId = userIdInput.value.trim();
                if (inputId) {
                    userId = inputId;
                    userIdDisplay.innerText = `User: ${userId}`;
                    userIdModal.classList.add('hidden');
                    console.log("User ID set to:", userId);
                    loadChatHistory(); // Load history after setting ID
                } else {
                    alert("Please enter a valid user ID.");
                }
            };

            // Function to load chat history from the backend
            async function loadChatHistory() {
                try {
                    const apiUrl = 'http://127.0.0.1:5000/history';
                    const payload = { user_id: userId };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`Failed to load history with status: ${response.status}`);
                    }
                    
                    const result = await response.json();
                    const history = result.history || [];
                    
                    if (history.length > 0) {
                        // Clear existing chat window before loading history
                        chatWindow.innerHTML = ''; 

                        history.forEach((message, index) => {
                            // The history array is a flat list. User messages are at even indices (0, 2, 4...) and bot messages are at odd indices (1, 3, 5...).
                            const isUser = index % 2 === 0;
                            displayMessage(message, isUser);
                        });
                        console.log("Chat history loaded successfully.");
                    } else {
                        console.log("No previous chat history found.");
                    }

                } catch (error) {
                    console.error('Error loading chat history:', error);
                }
            }
            
            // Show the user ID modal on page load
            window.onload = function() {
                userIdModal.classList.remove('hidden');
                userIdInput.focus();
            };

            // Function to display a message in the chat window
            function displayMessage(text, isUser = false, audioUrl = null) {
                const messageElement = document.createElement('div');
                messageElement.classList.add('flex', isUser ? 'justify-end' : 'justify-start');
                
                const bubble = document.createElement('div');
                bubble.classList.add('rounded-xl', 'p-3', 'max-w-[75%]', 'break-words', 'shadow-md', 'transition-all', 'duration-200');
                bubble.classList.add(isUser ? 'bg-green-600' : 'bg-zinc-700');
                
                bubble.innerText = text;
                messageElement.appendChild(bubble);

                if (audioUrl) {
                    const audioContainer = document.createElement('div');
                    audioContainer.classList.add('flex', 'items-center', 'ml-2', 'space-x-1');

                    const audio = new Audio(audioUrl);
                    
                    const playButton = document.createElement('button');
                    playButton.innerHTML = '<i class="fa-solid fa-volume-high text-xl text-gray-300"></i>';
                    playButton.classList.add('focus:outline-none');
                    
                    const pauseButton = document.createElement('button');
                    pauseButton.innerHTML = '<i class="fa-solid fa-pause text-xl text-gray-300"></i>';
                    pauseButton.classList.add('focus:outline-none', 'hidden'); // Hide initially

                    playButton.onclick = () => {
                        audio.play().then(() => {
                            playButton.classList.add('hidden');
                            pauseButton.classList.remove('hidden');
                        }).catch(e => {
                            console.error("Audio playback failed:", e);
                            showModal('Audio Error', 'Could not play audio. Your browser might require user interaction to enable playback. Please ensure your backend is running.');
                        });
                    };

                    pauseButton.onclick = () => {
                        audio.pause();
                        playButton.classList.remove('hidden');
                        pauseButton.classList.add('hidden');
                    };

                    audio.onended = () => {
                        playButton.classList.remove('hidden');
                        pauseButton.classList.add('hidden');
                    };

                    audioContainer.appendChild(playButton);
                    audioContainer.appendChild(pauseButton);
                    messageElement.appendChild(audioContainer);
                }
                
                chatWindow.appendChild(messageElement);
                
                // Scroll to the bottom of the chat window
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }

            // Show a loading indicator (dots)
            function showLoading() {
                const loadingElement = document.createElement('div');
                loadingElement.id = 'loadingIndicator';
                loadingElement.classList.add('flex', 'justify-start');
                
                const bubble = document.createElement('div');
                bubble.classList.add('bg-zinc-700', 'rounded-xl', 'p-3', 'max-w-[75%]', 'break-words', 'shadow-md', 'transition-all', 'duration-200');
                bubble.innerHTML = '<i class="fa-solid fa-ellipsis fa-fade"></i>';
                loadingElement.appendChild(bubble);
                chatWindow.appendChild(loadingElement);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }

            // Hide the loading indicator
            function hideLoading() {
                const loadingElement = document.getElementById('loadingIndicator');
                if (loadingElement) {
                    loadingElement.remove();
                }
            }
            
            // Function to show a custom modal instead of alert()
            function showModal(title, message) {
                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalMessage').innerText = message;
                document.getElementById('messageModal').classList.remove('hidden');
                document.getElementById('messageModal').classList.add('flex');
            }

            // Function to close the custom modal
            window.closeModal = function() {
                document.getElementById('messageModal').classList.remove('flex');
                document.getElementById('messageModal').classList.add('hidden');
            };

            // Main function to handle sending a message
            window.sendMessage = async function() {
                if (!userId) {
                    showModal('Error', 'Please enter your user ID to begin.');
                    return;
                }

                const userMessage = userInput.value.trim();
                if (userMessage === '') {
                    showModal('Error', 'Please enter your message.');
                    return;
                }

                // Display user's message
                displayMessage(userMessage, true);
                userInput.value = '';
                
                // Show loading indicator
                showLoading();

                // THIS CODE BLOCK NEEDS TO BE MODIFIED TO INTEGRATE WITH YOUR BACKEND
                try {
                    // Replace 'http://127.0.0.1:5000/chat' with your Python backend API URL
                    const apiUrl = 'http://127.0.0.1:5000/chat';
                    
                    // Send the user's message in the request body
                    const payload = {
                        user_id: userId,
                        message: userMessage
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('API call failed. Status:', response.status, 'Text:', errorText);
                        throw new Error(`API call failed with status: ${response.status}`);
                    }
                    
                    const result = await response.json();
                    console.log('Received JSON response:', result); // Log the full response
                    
                    const botResponse = result.response || 'Could not generate a response.';
                    const audioUrl = result.audio_url || null;
                    
                    // Hide loading indicator and display bot's message
                    hideLoading();
                    displayMessage(botResponse, false, audioUrl);

                } catch (error) {
                    hideLoading();
                    console.error('Error calling API:', error);
                    showModal('Connection Error', `Could not connect to the backend. Please ensure your Python server is running and the API URL is correct.`);
                }
            };
        })();
    </script>
</body>
</html>
